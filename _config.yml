source      : ./_src
destination : ./docs
safe        : true
title       : "Синематографъ"
slogan      : "Тёплое ламповое кино"

locale      : ru_RU
logo        : '/favicon.png'
description : "Тёплое ламповое кино"

markdown            : kramdown
kramdown:
  auto_ids          : true
  entity_output     : as_char
  toc_levels        : [1, 2, 3, 4, 5, 6]
  smart_quotes      : lsquo,rsquo,ldquo,rdquo
  input             : GFM
  hard_wrap         : false
  footnote_nr       : 1
  show_warnings     : false

plugins:
  - jekyll-seo-tag

whitelist:
  - jekyll-seo-tag
